plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.ninja.android"
    compileSdk 35

    defaultConfig {
        applicationId "com.ninja.android"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "armeabi-v7a"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

dependencies {
}
